[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-tensors"
version = "0.2.0"
description = "A small tensor and automatic-differentiation engine written in pure Python."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mihlali Sifuba" },
]
keywords = [
    "automatic-differentiation",
    "machine-learning",
    "tensor",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
typing = [
    "mypy>=2.3,<3",
]
numpy = [
    "numpy>=1.24",
]
cuda12 = [
    "cupy-cuda12x[ctk]>=14",
]
cuda13 = [
    "cupy-cuda13x[ctk]>=14",
]

[project.urls]
Homepage = "https://github.com/Mihlali-Sifuba/tensors"
Repository = "https://github.com/Mihlali-Sifuba/tensors"
Issues = "https://github.com/Mihlali-Sifuba/tensors/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tensors*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
tensors = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["tests/typing"]
follow_imports = "silent"
strict = true
